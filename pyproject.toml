[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-board-demo"
version = "0.1.0"
description = "A small demo project for GitHub collaboration with Cursor and Codex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team Board contributors" }]
dependencies = []

[project.scripts]
team-board = "team_board.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
